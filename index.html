<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Villes</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#app {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.card {
    background: rgba(0,0,0,0.25);
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    backdrop-filter: blur(10px);
}

input {
    width: 75%;
    max-width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-bottom: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 15px;
    font-size: 16px;
}

button:active {
    transform: scale(0.97);
}

.hidden { display: none; }

.info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

#leaderboard {
    text-align: left;
    margin-top: 10px;
    font-size: 14px;
}

#result {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}
</style>

</head>
<body>

<div id="app">

<!-- MENU -->
<div id="menu" class="card">
    <h1>🎮 Quiz Villes</h1>

    <input id="totemInput" placeholder="Ton totem" maxlength="25">

    <button onclick="startGame('ville')">Ville → Code</button>
    <button onclick="startGame('code')">Code → Ville</button>

    <h2>🏆 Classement</h2>
    <div id="leaderboard">Chargement...</div>
</div>

<!-- GAME -->
<div id="game" class="card hidden">

    <div class="info">
        <div id="score">Score : 0</div>
        <div id="lives">❤️❤️❤️</div>
        <div id="timer">10</div>
    </div>

    <h2 id="question"></h2>
    <div id="choices"></div>

    <p id="result"></p>

</div>

<!-- END -->
<div id="end" class="card hidden">
    <h2>💀 Fin de partie</h2>
    <p id="finalScore"></p>
    <button onclick="goMenu()">Retour menu</button>
</div>

</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBvuufBEZgzpN-Kp0PxtJJ5odVZA2tGQ7M",
  authDomain: "jeu-th.firebaseapp.com",
  projectId: "jeu-th",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= DATA ================= */
const data = [
    {ville:"Walcourt", code:"TH001"},
    {ville:"Rosée", code:"TH002"},
    {ville:"Morialmé", code:"TH003"},
    {ville:"Froidchapelle", code:"TH004"},
    {ville:"Fraire", code:"TH005"},
    {ville:"Rance", code:"TH008"},
    {ville:"Petigny", code:"TH009"},
    {ville:"Chimay", code:"TH011"},
    {ville:"Cerfontaine", code:"TH014"}
];

/* ================= VARIABLES ================= */
let score, lives, timer, timeLeft, correct, mode, player;
let locked = false;

/* ================= START ================= */
function startGame(m) {
    mode = m;
    player = document.getElementById("totemInput").value || "Anonyme";
    player = player.substring(0, 25);

    score = 0;
    lives = 3;

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    updateUI();
    newQuestion();
}

/* ================= UI ================= */
function updateUI() {
    document.getElementById("score").innerText = "Score : " + score;
    document.getElementById("lives").innerText = "❤️".repeat(Math.max(0, lives));
}

/* ================= QUESTION ================= */
function newQuestion() {
    locked = false;
    clearInterval(timer);
    document.getElementById("result").innerText = "";

    correct = data[Math.floor(Math.random() * data.length)];

    let choices = [correct];
    while (choices.length < 4) {
        let r = data[Math.floor(Math.random() * data.length)];
        if (!choices.includes(r)) choices.push(r);
    }

    choices.sort(() => Math.random() - 0.5);

    let question, display;

    if (mode === "ville") {
        question = "Code de : " + correct.ville;
        display = choices.map(c => c.code);
    } else {
        question = "Ville de : " + correct.code;
        display = choices.map(c => c.ville);
    }

    document.getElementById("question").innerText = question;

    let div = document.getElementById("choices");
    div.innerHTML = "";

    display.forEach((text, i) => {
        let btn = document.createElement("button");
        btn.innerText = text;

        btn.onclick = () => {
            if (locked) return;
            locked = true;

            clearInterval(timer);

            if (choices[i] === correct) {
                score++;
                updateUI();

                document.getElementById("result").innerText =
                    "🎉 Bonne réponse !";

                setTimeout(newQuestion, 800);
            } else {
                loseLife();
            }
        };

        div.appendChild(btn);
    });

    startTimer();
}

/* ================= TIMER ================= */
function startTimer() {
    timeLeft = 10;
    document.getElementById("timer").innerText = timeLeft;

    timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);
            loseLife();
        }
    }, 1000);
}

/* ================= LOSE LIFE ================= */
function loseLife() {
    if (locked && lives <= 0) return;
    locked = true;

    lives--;

    let answer = mode === "ville" ? correct.code : correct.ville;

    document.getElementById("result").innerText =
        "❌ Mauvaise réponse ! La bonne réponse était : " + answer;

    updateUI();

    if (lives <= 0) {
        endGame();
    } else {
        setTimeout(newQuestion, 1500);
    }
}

/* ================= END ================= */
function endGame() {
    document.getElementById("game").classList.add("hidden");
    document.getElementById("end").classList.remove("hidden");

    document.getElementById("finalScore").innerText =
        player + " → " + score + " points";

    saveScore();
}

/* ================= SAVE ================= */
function saveScore() {
    db.collection("scores").add({
        totem: player,
        score: score,
        date: new Date()
    });
}

/* ================= LEADERBOARD ================= */
function listenLeaderboard() {
    db.collection("scores")
    .orderBy("score", "desc")
    .limit(10)
    .onSnapshot(snapshot => {

        let html = "";

        snapshot.forEach(doc => {
            let d = doc.data();
            html += `<div>🧑 ${d.totem} — <b>${d.score}</b></div>`;
        });

        document.getElementById("leaderboard").innerHTML =
            html || "Aucun score";
    });
}

/* ================= MENU ================= */
function goMenu() {
    document.getElementById("end").classList.add("hidden");
    document.getElementById("menu").classList.remove("hidden");
}

/* ================= INIT ================= */
listenLeaderboard();

</script>

</body>
</html>
